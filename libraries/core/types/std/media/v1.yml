types:
  Image:
    arrow: Struct
    description: "Raw image with width, height, encoding, data fields"
    metadata:
      - key: frame_id
        description: "Frame the data is expressed in (frame dictionary name)"
      - key: stamp_ns
        description: "Capture time, integer nanoseconds"
    fields:
      - name: width
        type: UInt32
      - name: height
        type: UInt32
      - name: encoding
        type: Utf8
      - name: data
        type: LargeBinary
  CompressedImage:
    arrow: LargeBinary
    description: "JPEG/PNG compressed image bytes"
  PointCloud:
    arrow: Struct
    description: "3D point cloud: packed float32 points (layout given by the `fields` parameter, xyz or xyzi), width and height"
    params:
      - name: fields
        default: xyz
    metadata:
      - key: frame_id
        description: "Frame the data is expressed in (frame dictionary name)"
      - key: stamp_ns
        description: "Capture time, integer nanoseconds"
    fields:
      - name: points
        type: LargeBinary
      - name: width
        type: UInt32
      - name: height
        type: UInt32
  AudioFrame:
    arrow: Struct
    description: "Audio samples with sample_rate, channels, data fields"
    params:
      - name: sample_type
        default: f32
    fields:
      - name: sample_rate
        type: UInt32
      - name: channels
        type: UInt32
      - name: data
        type: LargeBinary
